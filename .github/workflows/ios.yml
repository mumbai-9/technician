name: iOS starter workflow

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build and Test default scheme using any available iPhone simulator
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          # Try workspace schemes first, then project schemes
          default=$(echo "$scheme_list" | ruby -e "require 'json'; j=JSON.parse(STDIN.read); if j['workspace'] && j['workspace']['schemes'] && j['workspace']['schemes'].any? then puts j['workspace']['schemes'][0]; elsif j['project'] && j['project']['schemes'] && j['project']['schemes'].any? then puts j['project']['schemes'][0]; else exit 1; end")
          echo "$default" > default
          echo "Using default scheme: $default"

      - name: Build
        env:
          scheme: default
          platform: "iOS Simulator"
        run: |
          # pick an available iPhone device name
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone[^\\(]+' | head -1 | sed -e 's/ Simulator$//' | awk '{$1=$1;print}')
          if [ "$scheme" = default ]; then scheme=$(cat default); fi

          # detect workspace or project
          if ls -A | grep -i '\.xcworkspace$' >/dev/null 2>&1; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i '\.xcworkspace$' | head -1)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i '\.xcodeproj$' | head -1)
          fi

          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          echo "Building scheme: $scheme, $filetype_parameter: $file_to_build, device: $device"
          xcodebuild build-for-testing -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device" CODE_SIGNING_ALLOWED=NO

      - name: Test
        env:
          scheme: default
          platform: "iOS Simulator"
        run: |
          device=$(xcrun xctrace list devices 2>&1 | grep -oE 'iPhone[^\\(]+' | head -1 | sed -e 's/ Simulator$//' | awk '{$1=$1;print}')
          if [ "$scheme" = default ]; then scheme=$(cat default); fi

          if ls -A | grep -i '\.xcworkspace$' >/dev/null 2>&1; then
            filetype_parameter="workspace"
            file_to_build=$(ls -A | grep -i '\.xcworkspace$' | head -1)
          else
            filetype_parameter="project"
            file_to_build=$(ls -A | grep -i '\.xcodeproj$' | head -1)
          fi

          file_to_build=$(echo "$file_to_build" | awk '{$1=$1;print}')
          echo "Testing scheme: $scheme, $filetype_parameter: $file_to_build, device: $device"
          xcodebuild test-without-building -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "platform=$platform,name=$device" CODE_SIGNING_ALLOWED=NO
